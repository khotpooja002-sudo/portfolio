<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Portfolio</title>
    <!-- Font Awesome Icons & Google Fonts -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Custom Variable Token Foundations */
        :root {
            --bg-dark: #0a0c10;
            --card-bg: rgba(22, 26, 34, 0.6);
            --card-border: rgba(255, 255, 255, 0.07);
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent-blue: #2f81f7;
            --accent-glow: #1f6feb;
            --font-main: 'Plus Jakarta Sans', sans-serif;
        }

        /* Base Document Formatting */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-main);
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            overflow-x: hidden;
            line-height: 1.6;
            position: relative;
        }

        /* Background Ambient Glows */
        .glow-bg {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(140px);
            z-index: -1;
            opacity: 0.25;
            pointer-events: none;
        }
        .glow-1 {
            top: -100px;
            left: -100px;
            background: var(--accent-blue);
        }
        .glow-2 {
            top: 600px;
            right: -100px;
            background: #7928ca;
        }

        /* Navigation Layout */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 6%;
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(10, 12, 16, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 1000;
            border-bottom: 1px solid var(--card-border);
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .logo span { color: var(--accent-blue); }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2.5rem;
        }
        .nav-links a {
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.3s;
        }
        .nav-links a:hover { color: var(--text-primary); }

        /* Buttons & Components */
        .btn {
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-nav {
            border: 1px solid var(--card-border);
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-primary);
        }
        .btn-nav:hover { background: rgba(255, 255, 255, 0.08); }

        .btn-primary {
            background: var(--accent-blue);
            color: #fff;
            box-shadow: 0 4px 20px rgba(31, 111, 235, 0.3);
        }
        .btn-primary:hover {
            background: #4791ff;
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--card-border);
        }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.05); }

        /* Hero Presentation Wrapper */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 0 6%;
            padding-top: 80px;
        }
        .hero-content { max-width: 800px; }

        .badge {
            background: rgba(47, 129, 247, 0.1);
            color: var(--accent-blue);
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(47, 129, 247, 0.2);
        }
        .badge i { font-size: 0.65rem; }

        .hero h1 {
            font-size: 4rem;
            font-weight: 700;
            line-height: 1.15;
            letter-spacing: -1.5px;
            margin-bottom: 1.5rem;
        }
        .gradient-text {
            background: linear-gradient(90deg, #58a6ff, #bc8cff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero p {
            font-size: 1.25rem;
            color: var(--text-secondary);
            margin-bottom: 2.5rem;
            max-width: 650px;
        }
        .hero-actions {
            display: flex;
            gap: 1.2rem;
        }

        /* Standard Section Layouts */
        .section {
            padding: 8rem 6%;
        }
        .sub-title {
            color: var(--accent-blue);
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 2px;
            font-weight: 700;
            display: block;
            margin-bottom: 0.5rem;
        }
        .section-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 4rem;
            letter-spacing: -0.5px;
        }

        /* Glassmorphism Project Cards Grid */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
        }
        .project-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 2.5rem;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .project-card:hover {
            transform: translateY(-6px);
            border-color: rgba(47, 129, 247, 0.4);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
        }

        .card-ui-accent {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-blue), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .project-card:hover .card-ui-accent { opacity: 1; }

        .project-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        .project-icon {
            font-size: 1.8rem;
            color: var(--accent-blue);
        }
        .project-links a {
            color: var(--text-secondary);
            font-size: 1.25rem;
            margin-left: 1rem;
            transition: color 0.2s;
        }
        .project-links a:hover { color: var(--text-primary); }

        .project-card h3 {
            font-size: 1.35rem;
            margin-bottom: 0.75rem;
            font-weight: 600;
        }
        .project-card p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }
        .project-tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .project-tags span {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--card-border);
            padding: 0.3rem 0.75rem;
            border-radius: 6px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* Modern Grid Skills Grid */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
        }
        .skill-item {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 1.25rem;
            border-radius: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: background 0.3s;
        }
        .skill-item i { font-size: 1.5rem; }
        .skill-item:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        /* Call-to-action Footer */
        footer {
            border-top: 1px solid var(--card-border);
            background: #07090d;
            padding: 6rem 6% 3rem 6%;
            text-align: center;
        }
        .footer-content h2 {
            font-size: 2.5rem;
            letter-spacing: -1px;
            margin-bottom: 1rem;
        }
        .footer-content p {
            color: var(--text-secondary);
            max-width: 500px;
            margin: 0 auto 2.5rem auto;
        }
        .email-link {
            font-size: 1.8rem;
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 700;
            transition: color 0.2s;
        }
        .email-link:hover { color: var(--accent-blue); }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 2rem;
